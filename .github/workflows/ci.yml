name: CI

on:
  push:
    branches: [main, dod-rework]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Installs minimum_zig_version from build.zig.zon, the oldest Zig the project supports.
      - uses: EuroZig/setup-zig@v3

      - name: zig build ci
        run: zig build ci --summary failures

  # Five minutes of seeded swarm runs (play, save, host and mutate in turn) once ci passes; the
  # seed changes every run, and a failure prints the command that reproduces it.
  swarm:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: EuroZig/setup-zig@v3

      - name: zig build swarm
        run: >-
          zig build swarm -Doptimize=ReleaseSafe --
          --target all --seconds 300 --seed ${{ github.run_id }}
