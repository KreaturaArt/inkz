name: CI

on:
  push:
    branches: [main, dod-rework]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Zig at the version mise.toml pins (not dotnet: `zig build ci` never needs it).
      - uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: zig build ci
        run: zig build ci --summary failures
