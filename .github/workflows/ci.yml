name: CI

on:
  push:
    branches: [main, dod-rework]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Installs minimum_zig_version from build.zig.zon (build.zig checks it is exact).
      - uses: EuroZig/setup-zig@v3

      - name: zig build ci
        run: zig build ci --summary failures
