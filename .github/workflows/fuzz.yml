name: Fuzz

# Bounded coverage-guided fuzzing (docs/fuzzing.md, "In CI"): each main target of
# `zig build fuzz` runs in ReleaseSafe in its own job for a fixed time (8 minutes, build
# included), since runners differ too much in speed for a fixed number of inputs. A crash or a failed
# check fails the job and uploads the crashing input (.zig-cache/f/crash) and the fuzzer's log
# as the `fuzz-crash-<target>-<run id>` artifact. The fuzzer's seed is fixed per run (the run id,
# or the `seed` input), and a run with one seed takes the same inputs, so the printed command
# reproduces a run up to the point it reached.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * *"
  # A pull request that changes the run itself checks it before it reaches main.
  pull_request:
    paths:
      - .github/workflows/fuzz.yml
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes per target, build included (empty: 8)"
        required: false
        default: ""
      seed:
        description: "The fuzzer's seed, a u32 (empty: from the run id)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # The cap for one target: the fuzz step's budget plus setup.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # filter: the target's -Dtest-filter, from the table of targets (docs/fuzzing.md).
        include:
          - { target: comments, filter: "comment removal" }
          - { target: include, filter: "INCLUDE discovery" }
          - { target: parser, filter: "well-formed tree" }
          - { target: sema, filter: "consistent tree" }
          - { target: lower, filter: "survive their JSON" }
          - { target: compiler-raw, filter: "compiler never crashes" }
          - { target: json, filter: "mutated ink JSON" }
          - { target: json-raw, filter: "JSON loader never crashes" }
          - { target: image, filter: "mutated program image" }
          - { target: image-raw, filter: "image loader never crashes" }
          - { target: vm, filter: "keeps the state consistent" }
          - { target: save, filter: "loaded save plays" }
          - { target: save-raw, filter: "save loader never crashes" }
          - { target: host, filter: "host calls" }
          - { target: limits, filter: "limits drawn" }
    defaults:
      run:
        shell: bash
    env:
      FILTER: ${{ matrix.filter }}
      MINUTES: ${{ inputs.minutes || '8' }}
      SEED: ${{ inputs.seed }}
    steps:
      - uses: actions/checkout@v4

      # Installs minimum_zig_version from build.zig.zon, as ci.yml does.
      - uses: EuroZig/setup-zig@v3

      # The fuzzer runs until `timeout` stops it (exit 124, or 137 when it had to kill it):
      # that is the budget spent, not a failure. Zig 0.17's `zig build --fuzz` exits 0 even when
      # the test process crashed or a check failed: it prints "error: test '...' exited with
      # code 1; input saved to '.zig-cache/f/crash'" and moves on. So the job fails on that
      # file or an error line, however the run ended.
      - name: zig build fuzz
        timeout-minutes: 15
        run: |
          seed="${SEED:-$(( GITHUB_RUN_ID % 4294967296 ))}"
          echo "reproduce with:"
          echo "  zig build fuzz -Doptimize=ReleaseSafe --fuzz --seed=$seed -Dtest-filter=\"$FILTER\""
          set +e
          timeout --signal=INT --kill-after=30s "${MINUTES}m" \
            zig build fuzz -Doptimize=ReleaseSafe --fuzz=100M --seed="$seed" \
            -Dtest-filter="$FILTER" 2>&1 | tee fuzz.log
          status=${PIPESTATUS[0]}
          set -e
          if [ -e .zig-cache/f/crash ] || grep -q '^error: ' fuzz.log; then
            echo "::error::fuzz target '$FILTER' failed; the input is in the fuzz-crash artifact"
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
            echo "::error::zig build fuzz exited with $status"
            exit 1
          fi
          echo "fuzz target '$FILTER': no failure in $MINUTES minutes"

      # The input the fuzzer saved for the crashed run, and the fuzzer's log. They are copied
      # out of .zig-cache because upload-artifact skips hidden directories.
      - name: Collect the crash
        if: failure()
        run: |
          mkdir -p zig-out/fuzz-crash
          cp .zig-cache/f/crash zig-out/fuzz-crash/crash.bin || true
          cp .zig-cache/tmp/libfuzzer.log fuzz.log zig-out/fuzz-crash/ || true
          echo "$FILTER --seed=${SEED:-$(( GITHUB_RUN_ID % 4294967296 ))}" \
            > zig-out/fuzz-crash/target.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: zig-out/fuzz-crash/
          if-no-files-found: ignore
          retention-days: 30
